<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Lab — your rocket projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,560;9..144,620&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3EF; --paper-raised:#FBFCFA; --ink:#1C1F1B; --ink-muted:#5B6158;
    --royal:#2F3B8C; --royal-deep:#1C2458; --coral:#B84A52; --amber:#E2A33B;
    --line:#D8DBD2; --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  a{color:var(--royal);}
  button, input, textarea{font-family:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--royal); outline-offset:2px;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:620; line-height:1.1; margin:0 0 .4em 0; letter-spacing:-0.01em;}
  h1{font-size:1.8rem;}
  h2{font-size:1.4rem;}
  h3{font-size:1.05rem;}
  p{margin:0 0 1em 0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .muted{color:var(--ink-muted);}
  .eyebrow{color:var(--ink-muted); font-size:0.88rem; margin:0 0 .3em 0;}

  header{position:sticky; top:0; background:var(--paper); z-index:50; border-bottom:1px solid var(--line);}
  header .row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:16px 0;}
  .wordmark{font-family:'Fraunces',serif; font-weight:620; font-size:1.2rem; color:var(--royal-deep); text-decoration:none;}
  .hdr-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  main{padding:36px 0 80px 0;}

  .btn{appearance:none; border:1px solid var(--royal); background:none; color:var(--royal); font-size:0.9rem; padding:8px 14px; border-radius:var(--radius); cursor:pointer;}
  .btn:hover{background:var(--royal); color:#fff;}
  .btn.solid{background:var(--royal); color:#fff;}
  .btn.solid:hover{background:var(--royal-deep);}
  .btn.ghost{border-color:var(--line); color:var(--ink-muted);}
  .btn.ghost:hover{background:var(--paper-raised); color:var(--ink);}
  .btn.danger{border-color:var(--coral); color:var(--coral);}
  .btn.danger:hover{background:var(--coral); color:#fff;}
  .btn.small{padding:4px 9px; font-size:0.8rem;}
  .btn[disabled]{opacity:0.4; cursor:default;}
  .file-btn{position:relative; overflow:hidden; display:inline-block;}
  .file-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}

  /* ---------- Status banner ---------- */
  .status-banner{display:flex; align-items:center; gap:10px; background:rgba(226,163,59,0.14); border:1px solid var(--amber); padding:10px 16px; font-size:0.86rem; margin-bottom:24px;}
  .status-banner .dot{width:7px; height:7px; border-radius:50%; background:var(--amber); flex:none;}
  .save-status{font-size:0.82rem; color:var(--ink-muted);}
  .save-status.ok{color:var(--royal);}

  /* ---------- Gallery ---------- */
  .gallery-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:24px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:1px; background:var(--line); border:1px solid var(--line);}
  .card{background:var(--paper-raised); padding:22px; cursor:pointer; display:flex; flex-direction:column; gap:6px; min-height:140px;}
  .card:hover{background:#fff;}
  .card h3{margin-bottom:2px;}
  .card .tagline{font-size:0.88rem; color:var(--ink-muted); flex:1;}
  .card .meta{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--royal); margin-top:8px;}
  .card.new{align-items:center; justify-content:center; text-align:center; color:var(--ink-muted); border:1px dashed var(--line); background:transparent;}
  .card.new:hover{color:var(--royal); border-color:var(--royal);}
  .empty{padding:60px 20px; text-align:center; color:var(--ink-muted);}

  /* ---------- Detail view ---------- */
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:8px;}
  .back-link{font-size:0.88rem; display:inline-block; margin-bottom:18px;}
  .name-field{font-family:'Fraunces',serif; font-size:1.8rem; font-weight:620; border:none; background:none; color:var(--ink); width:100%; padding:2px 0; border-bottom:1px solid transparent;}
  .name-field:focus{border-bottom:1px solid var(--line); outline:none;}
  .tagline-field{width:100%; border:none; background:none; color:var(--ink-muted); font-size:0.98rem; padding:2px 0; border-bottom:1px solid transparent;}
  .tagline-field:focus{border-bottom:1px solid var(--line); outline:none;}

  .panel{background:var(--paper-raised); border:1px solid var(--line); padding:26px; margin-top:22px;}
  .panel h2{margin-bottom:16px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:14px;}
  @media (max-width:620px){ .field-row{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:0.82rem; color:var(--ink-muted);}
  .field input, .field textarea{padding:9px 11px; border:1px solid var(--line); background:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:0.92rem; color:var(--ink); border-radius:var(--radius); width:100%;}
  .field textarea{font-family:'IBM Plex Sans',sans-serif; resize:vertical; min-height:70px;}

  table{width:100%; border-collapse:collapse; margin-top:4px; font-size:0.9rem;}
  th{text-align:left; font-weight:500; color:var(--ink-muted); font-size:0.78rem; padding:6px 8px;}
  td{padding:4px 6px; vertical-align:middle;}
  td input{width:100%; padding:7px 8px; border:1px solid var(--line); background:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:0.86rem; border-radius:var(--radius);}
  .comp-table{margin-bottom:12px;}

  .calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:6px;}
  @media (max-width:620px){ .calc-grid{grid-template-columns:1fr;} }
  .calc-result{background:var(--royal-deep); color:#fff; padding:22px; border-radius:var(--radius); align-self:start;}
  .calc-result .big{font-family:'IBM Plex Mono',monospace; font-size:2.2rem; line-height:1;}
  .calc-result .sub{font-size:0.85rem; opacity:0.8; margin-top:8px;}

  .save-row{display:flex; justify-content:space-between; align-items:center; margin-top:26px; flex-wrap:wrap; gap:10px;}
</style>
</head>
<body>

<header>
  <div class="wrap row">
    <a class="wordmark" href="#" id="home-link">Rocket Lab</a>
    <div class="hdr-actions">
      <span class="save-status" id="save-status"></span>
      <button class="btn ghost small" id="export-btn">Export all (.json)</button>
      <label class="btn ghost small file-btn">Import (.json)<input type="file" id="import-input" accept="application/json"></label>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
  // ---------- Storage layer: tries persistent artifact storage, falls back to in-memory ----------
  const STORE_KEY = 'rocket-lab-projects';
  let storageAvailable = true;
  let rockets = [];

  async function loadRockets(){
    try{
      const res = await window.storage.get(STORE_KEY, false);
      rockets = res && res.value ? JSON.parse(res.value) : [];
    } catch(e){
      // Either the key doesn't exist yet, or window.storage isn't available in this context
      if(typeof window.storage === 'undefined'){ storageAvailable = false; }
      rockets = [];
    }
  }
  async function persist(){
    const status = document.getElementById('save-status');
    try{
      if(typeof window.storage === 'undefined') throw new Error('no storage');
      await window.storage.set(STORE_KEY, JSON.stringify(rockets), false);
      status.textContent = 'Saved';
      status.className = 'save-status ok';
    } catch(e){
      storageAvailable = false;
      status.textContent = 'Not persisted here — use Export to keep a copy';
      status.className = 'save-status';
    }
  }

  function uid(){ return 'r' + Math.random().toString(36).slice(2, 10); }

  function exampleRocket(){
    return {
      id: uid(),
      name: 'SPLC-1',
      tagline: 'Low-cost home-built sounding rocket — champagne-glass nose, golf-tube fuselage',
      components: [
        { id: uid(), name: 'Nose cone', material: 'Polycarbonate (champagne flute)', dims: '12.7 x 3.175 cm', mass: '' },
        { id: uid(), name: 'Parachute bay', material: 'Plastic (pill bottle)', dims: '10.5 cm, OD 3.175 cm', mass: '' },
        { id: uid(), name: 'Fuselage', material: 'Golf-tube plastic', dims: '35 cm, OD 3.175 cm', mass: '' },
        { id: uid(), name: 'Fin set (x3)', material: 'Balsa', dims: 'Root 12 / tip 6 / span 4.5 cm', mass: '6.2' },
      ],
      motor: { name: 'Estes D12', diameter: '24', length: '70', impulse: '17', mass: '42.6' },
      sim: { apogee: '171', maxVel: '53.6', maxAccel: '115', stability: '7.24', flightTime: '48.8' },
      parachute: { diameter: '49', mass: '20-30', notes: 'Custom calc vs. SkyAngle Classic 32 preset — unreconciled' },
      notes: 'Design proposal, verified in OpenRocket simulation only — no physical flight.',
      updatedAt: Date.now()
    };
  }
  function blankRocket(){
    return {
      id: uid(), name: 'New rocket', tagline: '',
      components: [{ id: uid(), name: '', material: '', dims: '', mass: '' }],
      motor: { name: '', diameter: '', length: '', impulse: '', mass: '' },
      sim: { apogee: '', maxVel: '', maxAccel: '', stability: '', flightTime: '' },
      parachute: { diameter: '', mass: '', notes: '' },
      notes: '', updatedAt: Date.now()
    };
  }

  // ---------- Routing ----------
  let view = 'gallery', currentId = null;
  function goGallery(){ view = 'gallery'; currentId = null; render(); }
  function goDetail(id){ view = 'detail'; currentId = id; render(); }
  document.getElementById('home-link').addEventListener('click', (e) => { e.preventDefault(); goGallery(); });

  // ---------- Render ----------
  function render(){
    const app = document.getElementById('app');
    app.innerHTML = view === 'gallery' ? renderGallery() : renderDetail(rockets.find(r => r.id === currentId));
    wireEvents();
  }

  function renderGallery(){
    const banner = storageAvailable ? '' : `<div class="status-banner"><span class="dot"></span><span>This page can't reach persistent storage right now, so projects only last for this session. Use <strong>Export</strong> before you close the tab, and <strong>Import</strong> next time to pick up where you left off.</span></div>`;
    const cards = rockets.map(r => `
      <div class="card" data-open="${r.id}">
        <h3>${escapeHtml(r.name) || 'Untitled rocket'}</h3>
        <div class="tagline">${escapeHtml(r.tagline) || 'No description yet.'}</div>
        <div class="meta">${r.sim.apogee ? r.sim.apogee + ' m apogee' : 'No simulation data yet'}</div>
      </div>
    `).join('');
    const emptyState = rockets.length ? '' : `<div class="empty">No rocket projects yet. Add one to get started, or load the SPLC-1 example.</div>`;
    return `
      ${banner}
      <div class="gallery-head">
        <div>
          <p class="eyebrow">Your projects</p>
          <h1>Rocket Lab</h1>
          <p class="muted" style="max-width:52ch;">One place for every rocket you design — specs, simulation results, and a parachute calculator per project. Not tied to any single build.</p>
        </div>
      </div>
      <div class="grid">
        ${cards}
        <div class="card new" data-new="blank">+ New rocket</div>
        <div class="card new" data-new="example">Load SPLC-1 as an example</div>
      </div>
      ${emptyState}
    `;
  }

  function renderDetail(r){
    if(!r) return `<p class="muted">Project not found.</p><a href="#" id="back-missing">&larr; Back</a>`;
    const compRows = r.components.map((c,i) => `
      <tr data-comp="${i}">
        <td><input data-f="name" value="${escapeAttr(c.name)}" placeholder="Component"></td>
        <td><input data-f="material" value="${escapeAttr(c.material)}" placeholder="Material"></td>
        <td><input data-f="dims" value="${escapeAttr(c.dims)}" placeholder="Dimensions"></td>
        <td><input data-f="mass" value="${escapeAttr(c.mass)}" placeholder="g" style="width:70px;"></td>
        <td><button class="btn danger small" data-remove-comp="${i}">&times;</button></td>
      </tr>
    `).join('');

    const totalMass = computeTotalMass(r);

    return `
      <a href="#" class="back-link" id="back-link">&larr; All projects</a>
      <div class="detail-head">
        <div style="flex:1; min-width:240px;">
          <input class="name-field" id="f-name" value="${escapeAttr(r.name)}" placeholder="Rocket name">
          <input class="tagline-field" id="f-tagline" value="${escapeAttr(r.tagline)}" placeholder="One-line description">
        </div>
        <button class="btn danger" id="delete-btn">Delete project</button>
      </div>

      <div class="panel">
        <h2>Components</h2>
        <table class="comp-table">
          <thead><tr><th>Name</th><th>Material</th><th>Dimensions</th><th>Mass</th><th></th></tr></thead>
          <tbody id="comp-body">${compRows}</tbody>
        </table>
        <button class="btn ghost small" id="add-comp">+ Add component</button>
      </div>

      <div class="panel">
        <h2>Motor</h2>
        <div class="field-row">
          <div class="field"><label>Name / designation</label><input id="m-name" value="${escapeAttr(r.motor.name)}" placeholder="e.g. Estes D12"></div>
          <div class="field"><label>Mass, loaded (g)</label><input id="m-mass" value="${escapeAttr(r.motor.mass)}"></div>
          <div class="field"><label>Diameter (mm)</label><input id="m-diameter" value="${escapeAttr(r.motor.diameter)}"></div>
          <div class="field"><label>Length (mm)</label><input id="m-length" value="${escapeAttr(r.motor.length)}"></div>
          <div class="field"><label>Total impulse (N&middot;s)</label><input id="m-impulse" value="${escapeAttr(r.motor.impulse)}"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Simulation results <span class="muted" style="font-size:0.8rem;font-weight:400;">(optional — fill in once you've run OpenRocket or similar)</span></h2>
        <div class="field-row">
          <div class="field"><label>Apogee (m)</label><input id="s-apogee" value="${escapeAttr(r.sim.apogee)}"></div>
          <div class="field"><label>Max velocity (m/s)</label><input id="s-maxvel" value="${escapeAttr(r.sim.maxVel)}"></div>
          <div class="field"><label>Max acceleration (m/s&sup2;)</label><input id="s-maxaccel" value="${escapeAttr(r.sim.maxAccel)}"></div>
          <div class="field"><label>Stability margin (cal)</label><input id="s-stability" value="${escapeAttr(r.sim.stability)}"></div>
          <div class="field"><label>Flight time (s)</label><input id="s-flighttime" value="${escapeAttr(r.sim.flightTime)}"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Parachute sizing calculator</h2>
        <p class="muted" style="font-size:0.9rem;">Same drag-based method regardless of which rocket you're designing.</p>
        <div class="calc-grid">
          <div>
            <div class="field" style="margin-bottom:12px;">
              <label>Rocket mass at deployment (g) &mdash; computed from components + motor, override if needed</label>
              <input id="calc-mass" value="${totalMass || ''}" placeholder="${totalMass || 'e.g. 200'}">
            </div>
            <div class="field" style="margin-bottom:12px;"><label>Target descent speed (m/s)</label><input id="calc-speed" value="5"></div>
            <div class="field" style="margin-bottom:12px;"><label>Drag coefficient (Cd)</label><input id="calc-cd" value="0.75"></div>
          </div>
          <div class="calc-result">
            <div style="font-size:0.9rem;opacity:0.8;">Canopy diameter</div>
            <div class="big"><span id="calc-out">&mdash;</span> cm</div>
            <div class="sub" id="calc-out-sub"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Notes &amp; open items</h2>
        <div class="field"><textarea id="f-notes" placeholder="Anything unresolved, sourcing questions, build notes...">${escapeHtml(r.notes)}</textarea></div>
      </div>

      <div class="save-row">
        <span class="muted" style="font-size:0.85rem;">Changes save automatically as you edit.</span>
        <button class="btn solid" id="save-btn">Save now</button>
      </div>
    `;
  }

  function computeTotalMass(r){
    let total = 0, any = false;
    r.components.forEach(c => { const v = parseFloat(c.mass); if(!isNaN(v)){ total += v; any = true; } });
    const mv = parseFloat(r.motor.mass); if(!isNaN(mv)){ total += mv; any = true; }
    return any ? Math.round(total) : '';
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

  // ---------- Event wiring ----------
  function wireEvents(){
    if(view === 'gallery'){
      document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => goDetail(el.dataset.open)));
      const nb = document.querySelector('[data-new="blank"]');
      if(nb) nb.addEventListener('click', () => { const r = blankRocket(); rockets.unshift(r); persist(); goDetail(r.id); });
      const ne = document.querySelector('[data-new="example"]');
      if(ne) ne.addEventListener('click', () => { const r = exampleRocket(); rockets.unshift(r); persist(); goDetail(r.id); });
      return;
    }

    const r = rockets.find(x => x.id === currentId);
    const back = document.getElementById('back-link') || document.getElementById('back-missing');
    if(back) back.addEventListener('click', (e) => { e.preventDefault(); goGallery(); });
    if(!r) return;

    const save = (recalc) => { r.updatedAt = Date.now(); persist(); if(recalc) runCalc(r); };

    document.getElementById('f-name').addEventListener('input', e => { r.name = e.target.value; save(); });
    document.getElementById('f-tagline').addEventListener('input', e => { r.tagline = e.target.value; save(); });
    document.getElementById('f-notes').addEventListener('input', e => { r.notes = e.target.value; save(); });

    document.getElementById('delete-btn').addEventListener('click', () => {
      rockets = rockets.filter(x => x.id !== r.id);
      persist(); goGallery();
    });

    document.querySelectorAll('#comp-body tr').forEach(tr => {
      const idx = parseInt(tr.dataset.comp, 10);
      tr.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          r.components[idx][inp.dataset.f] = inp.value;
          save(false);
          const t = computeTotalMass(r);
          const massField = document.getElementById('calc-mass');
          if(massField && !massField.dataset.touched) massField.value = t || '';
        });
      });
      tr.querySelector('[data-remove-comp]').addEventListener('click', () => {
        r.components.splice(idx, 1); save(); render();
      });
    });
    document.getElementById('add-comp').addEventListener('click', () => {
      r.components.push({ id: uid(), name:'', material:'', dims:'', mass:'' });
      save(); render();
    });

    [['m-name','name'],['m-mass','mass'],['m-diameter','diameter'],['m-length','length'],['m-impulse','impulse']].forEach(([id,f]) => {
      document.getElementById(id).addEventListener('input', e => { r.motor[f] = e.target.value; save(); });
    });
    [['s-apogee','apogee'],['s-maxvel','maxVel'],['s-maxaccel','maxAccel'],['s-stability','stability'],['s-flighttime','flightTime']].forEach(([id,f]) => {
      document.getElementById(id).addEventListener('input', e => { r.sim[f] = e.target.value; save(); });
    });

    document.getElementById('save-btn').addEventListener('click', () => save());

    const massField = document.getElementById('calc-mass');
    massField.addEventListener('input', () => { massField.dataset.touched = '1'; runCalc(r); });
    document.getElementById('calc-speed').addEventListener('input', () => runCalc(r));
    document.getElementById('calc-cd').addEventListener('input', () => runCalc(r));
    runCalc(r);
  }

  function runCalc(r){
    const massEl = document.getElementById('calc-mass');
    if(!massEl) return;
    const m = parseFloat(massEl.value) / 1000;
    const v = parseFloat(document.getElementById('calc-speed').value);
    const cd = parseFloat(document.getElementById('calc-cd').value);
    const out = document.getElementById('calc-out'), sub = document.getElementById('calc-out-sub');
    if(!m || !v || !cd || m<=0 || v<=0 || cd<=0){ out.textContent = '—'; sub.textContent = ''; return; }
    const g = 9.81, rho = 1.225;
    const diameterCm = Math.sqrt((8*m*g)/(Math.PI*rho*v*v*cd)) * 100;
    out.textContent = diameterCm.toFixed(0);
    sub.textContent = (diameterCm/2.54).toFixed(1) + ' in · ' + (Math.PI*Math.pow(diameterCm/2,2)).toLocaleString(undefined,{maximumFractionDigits:0}) + ' cm\u00B2 canopy';
    const r2 = rockets.find(x => x.id === currentId);
    if(r2){ r2.parachute.diameter = diameterCm.toFixed(0); persist(); }
  }

  // ---------- Export / Import ----------
  document.getElementById('export-btn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(rockets, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'rocket-lab-export.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  document.getElementById('import-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const imported = JSON.parse(reader.result);
        if(!Array.isArray(imported)) throw new Error('bad format');
        imported.forEach(ir => {
          const i = rockets.findIndex(x => x.id === ir.id);
          if(i >= 0) rockets[i] = ir; else rockets.unshift(ir);
        });
        persist(); goGallery();
      } catch(err){ alert('Could not read that file — expected a Rocket Lab export (.json).'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- Init ----------
  (async () => { await loadRockets(); render(); })();
</script>

</body>
</html>
